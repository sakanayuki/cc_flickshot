<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0B0D12" />
    <!-- インライン data URI。外部リソースを一切読まないため -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%230B0D12%22/%3E%3Crect%20x=%228%22%20y=%2226%22%20width=%2230%22%20height=%226%22%20rx=%223%22%20fill=%22%23C9A059%22%20transform=%22rotate(-6%208%2026)%22/%3E%3Crect%20x=%2226%22%20y=%2244%22%20width=%2230%22%20height=%226%22%20rx=%223%22%20fill=%22%23C9A059%22%20transform=%22rotate(6%2056%2050)%22/%3E%3Ccircle%20cx=%2246%22%20cy=%2216%22%20r=%229%22%20fill=%22%23E8B54B%22%20stroke=%22%235C3E0E%22%20stroke-width=%222%22/%3E%3C/svg%3E" />
    <meta
      name="description"
      content="コインを弾いてレーンを登らせ、ちょうどいい隙間から落として 5 段おりるアーケードゲーム。物理は Matter.js。"
    />
    <title>どうぶつの やまくだり</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        /* ドラッグでスクロール・ズームさせない。必須 */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <noscript
      style="position:fixed;inset:0;padding:24px;background:#0b0d12;color:#e9eef7;font:16px/1.6 system-ui,sans-serif"
      >このゲームは JavaScript が必要です。ブラウザの設定で有効にしてください。</noscript
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
