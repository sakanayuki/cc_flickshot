<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#8FD3F4" />
    <meta name="description" content="コインを弾いて山のてっぺんを目指す、小さな子ども向けのゲームです。" />
    <title>どうぶつの やまのぼり</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #8fd3f4;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        /* ドラッグでスクロール・ズームさせない。必須(詳細設計書 §6.2) */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
